<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>棱镜译 · PrismTrans</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* Anthropic palette */
  --near-black: #141413;
  --terracotta: #c96442;
  --coral: #d97757;
  --parchment: #f5f4ed;
  --ivory: #faf9f5;
  --white: #ffffff;
  --warm-sand: #e8e6dc;
  --dark-surface: #30302e;
  --deep-dark: #141413;
  --charcoal: #4d4c48;
  --olive: #5e5d59;
  --stone: #87867f;
  --dark-warm: #3d3d3a;
  --warm-silver: #b0aea5;
  --border-cream: #f0eee6;
  --border-warm: #e8e6dc;
  --ring-warm: #d1cfc5;
  --ring-deep: #c2c0b6;

  /* Typography */
  --serif: 'Noto Serif SC', Georgia, serif;
  --sans: 'Noto Sans SC', 'Arial', system-ui, sans-serif;

  /* Radius */
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 24px;
  --r-3xl: 32px;
}

body {
  font-family: var(--sans);
  background: var(--parchment);
  color: var(--near-black);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: var(--parchment);
  border-bottom: 1px solid var(--border-cream);
  position: sticky; top: 0; z-index: 100;
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 32px; height: 32px;
  background: var(--near-black);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-text {
  font-family: var(--serif);
  font-size: 18px; font-weight: 500;
  color: var(--near-black); letter-spacing: 0.2px;
}
.logo-sub {
  font-family: var(--sans);
  font-size: 10px; font-weight: 400;
  color: var(--stone); letter-spacing: 0.5px;
  text-transform: uppercase; display: block; margin-top: 1px;
}

.topbar-right { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-warm);
  background: var(--ivory);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--olive);
  box-shadow: 0px 0px 0px 0px var(--ivory), 0px 0px 0px 1px var(--ring-warm);
  transition: background 0.12s;
}
.icon-btn:active { background: var(--warm-sand); }

/* ── LANG SELECTOR ── */
.lang-bar {
  display: flex; align-items: center;
  padding: 12px 20px; gap: 8px;
  background: var(--ivory);
  border-bottom: 1px solid var(--border-cream);
}

.lang-pill {
  flex: 1; padding: 10px 14px;
  background: var(--parchment);
  border: 1px solid var(--border-warm);
  border-radius: var(--r-lg);
  cursor: pointer; text-align: center;
  transition: background 0.12s;
}
.lang-pill:active { background: var(--warm-sand); }
.lang-pill-name { font-size: 14px; font-weight: 500; color: var(--near-black); display: block; }
.lang-pill-code { font-size: 10px; color: var(--stone); display: block; margin-top: 2px; letter-spacing: 0.4px; }

.swap-btn {
  width: 34px; height: 34px; flex-shrink: 0;
  border-radius: var(--r-md);
  border: 1px solid var(--border-warm);
  background: var(--ivory);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--olive);
}
.swap-btn:active { background: var(--warm-sand); }

/* ── INPUT SECTION ── */
.input-section { padding: 16px 20px; background: var(--ivory); border-bottom: 1px solid var(--border-cream); }

.textarea-card {
  background: var(--white);
  border: 1px solid var(--border-warm);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: rgba(0,0,0,0.03) 0px 2px 12px;
}
.textarea-card:focus-within {
  border-color: var(--ring-warm);
  box-shadow: rgba(0,0,0,0.05) 0px 4px 24px;
}

#sourceText {
  width: 100%; min-height: 120px; max-height: 220px;
  padding: 16px;
  background: transparent; border: none; outline: none; resize: none;
  font-family: var(--sans); font-size: 15px; line-height: 1.65;
  color: var(--near-black);
}
#sourceText::placeholder { color: var(--warm-silver); }

.input-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  border-top: 1px solid var(--border-cream);
  background: var(--parchment);
}
.char-count { font-size: 12px; color: var(--warm-silver); letter-spacing: 0.2px; }
.clear-btn {
  font-size: 12px; color: var(--stone); background: none;
  border: none; cursor: pointer; font-family: var(--sans);
  padding: 2px 0;
}
.clear-btn:active { color: var(--terracotta); }

/* ── TRANSLATE BUTTON ── */
.translate-wrap { padding: 16px 20px; background: var(--ivory); border-bottom: 1px solid var(--border-cream); }

.translate-btn {
  width: 100%; padding: 14px 24px;
  background: var(--terracotta); color: var(--ivory);
  border: none; border-radius: var(--r-lg);
  font-family: var(--sans); font-size: 15px; font-weight: 500;
  cursor: pointer; letter-spacing: 0.3px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0px 0px 0px 0px var(--terracotta), 0px 0px 0px 1px var(--terracotta);
  transition: background 0.12s;
}
.translate-btn:active { background: #b5573a; }
.translate-btn:disabled {
  background: var(--warm-sand); color: var(--stone);
  cursor: not-allowed;
  box-shadow: none;
}

/* ── ENGINE PANEL ── */
.engine-panel { display: none; }
.engine-panel.active { display: block; }

/* Phase header strip */
.phase-strip {
  padding: 14px 20px 0;
  background: var(--parchment);
}

.phase-progress-row {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-cream);
}
.phase-status-text {
  font-size: 12px; color: var(--stone);
  font-family: var(--sans); flex: 1;
  letter-spacing: 0.2px;
}
.progress-track {
  width: 80px; height: 2px;
  background: var(--border-warm); border-radius: 2px; overflow: hidden; flex-shrink: 0;
}
.progress-fill {
  height: 100%; background: var(--terracotta);
  border-radius: 2px; width: 0%;
  transition: width 0.5s ease;
}

/* Round block */
.round-section { padding: 12px 20px; }

.round-card {
  background: var(--ivory);
  border: 1px solid var(--border-cream);
  border-radius: var(--r-xl);
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: rgba(0,0,0,0.03) 0px 2px 12px;
}

.round-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  background: var(--parchment);
  border-bottom: 1px solid var(--border-cream);
}
.round-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--near-black); color: var(--ivory);
  font-size: 11px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.round-title {
  font-family: var(--serif);
  font-size: 13px; font-weight: 500; color: var(--charcoal); flex: 1;
}
.round-badge {
  font-size: 10px; color: var(--stone);
  background: var(--warm-sand);
  padding: 2px 8px; border-radius: var(--r-2xl);
  letter-spacing: 0.3px;
}
.round-badge.done { color: var(--terracotta); background: #f9ede7; }

/* Path items */
.paths-row {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border-cream);
}
.path-item {
  flex: 1; padding: 10px 12px;
  border-right: 1px solid var(--border-cream);
  position: relative;
  -webkit-user-select: none; user-select: none;
}
.path-item:last-child { border-right: none; }

.path-label {
  font-size: 10px; color: var(--stone);
  letter-spacing: 0.5px; text-transform: uppercase;
  margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between;
}
.path-lock {
  font-size: 9px; color: var(--warm-silver);
  background: var(--warm-sand); padding: 1px 6px;
  border-radius: var(--r-2xl); letter-spacing: 0.3px;
}
.path-text {
  font-size: 12px; line-height: 1.6; color: var(--olive);
  min-height: 14px;
  -webkit-user-select: none; user-select: none;
}
.path-text.streaming::after {
  content: '▌'; animation: blink .65s steps(1) infinite;
  color: var(--warm-silver); font-size: 9px;
}

/* Critique section */
.critique-row {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border-cream);
  background: var(--parchment);
}
.critique-item {
  flex: 1; padding: 8px 12px;
  border-right: 1px solid var(--border-cream);
  -webkit-user-select: none; user-select: none;
}
.critique-item:last-child { border-right: none; }
.critique-label {
  font-size: 10px; color: var(--warm-silver);
  letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px;
}
.critique-text {
  font-size: 11px; line-height: 1.55; color: var(--stone);
  min-height: 12px;
  -webkit-user-select: none; user-select: none;
}
.critique-text.streaming::after {
  content: '▌'; animation: blink .65s steps(1) infinite;
  color: var(--warm-silver); font-size: 9px;
}

/* Synthesis row */
.synth-row { padding: 12px 14px; background: var(--white); }
.synth-label {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 7px;
}
.synth-label-text {
  font-family: var(--serif);
  font-size: 11px; font-weight: 500; color: var(--charcoal);
  letter-spacing: 0.2px;
}
.synth-lock {
  font-size: 9px; color: var(--warm-silver);
  background: var(--warm-sand); padding: 1px 7px;
  border-radius: var(--r-2xl); letter-spacing: 0.3px;
  -webkit-user-select: none; user-select: none;
}
.synth-text {
  font-size: 13px; line-height: 1.65; color: var(--near-black);
  font-weight: 400; min-height: 16px;
  -webkit-user-select: none; user-select: none;
}
.synth-text.streaming::after {
  content: '▌'; animation: blink .65s steps(1) infinite;
  color: var(--stone); font-size: 10px;
}

/* Memo row (improvement notes) */
.memo-row {
  padding: 8px 14px 10px;
  background: var(--parchment);
  border-top: 1px solid var(--border-cream);
}
.memo-label {
  font-size: 10px; color: var(--warm-silver);
  letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px;
}
.memo-text {
  font-size: 11px; line-height: 1.55; color: var(--stone);
  min-height: 12px;
  -webkit-user-select: none; user-select: none;
}
.memo-text.streaming::after {
  content: '▌'; animation: blink .65s steps(1) infinite;
  color: var(--warm-silver); font-size: 9px;
}

@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

/* ── QUALITY AUDIT ── */
.audit-card {
  margin: 0 20px 12px;
  background: var(--ivory);
  border: 1px solid var(--border-cream);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: rgba(0,0,0,0.03) 0px 2px 12px;
}
.audit-header {
  padding: 11px 14px;
  background: var(--parchment);
  border-bottom: 1px solid var(--border-cream);
  display: flex; align-items: center; gap: 8px;
}
.audit-title {
  font-family: var(--serif);
  font-size: 13px; font-weight: 500; color: var(--charcoal);
}
.audit-body { padding: 14px; }
.score-row { display: flex; gap: 8px; margin-bottom: 12px; }
.score-item {
  flex: 1; text-align: center;
  background: var(--parchment);
  border: 1px solid var(--border-cream);
  border-radius: var(--r-lg); padding: 10px 6px;
}
.score-num {
  font-family: var(--serif);
  font-size: 22px; font-weight: 500; color: var(--near-black);
  display: block; line-height: 1;
}
.score-label { font-size: 10px; color: var(--stone); margin-top: 4px; letter-spacing: 0.3px; display: block; }
.score-bar-wrap { height: 3px; background: var(--border-warm); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.score-bar { height: 100%; background: var(--terracotta); border-radius: 2px; }

.audit-remark {
  font-size: 12px; line-height: 1.65; color: var(--olive);
  -webkit-user-select: none; user-select: none;
}
.audit-remark.streaming::after {
  content: '▌'; animation: blink .65s steps(1) infinite;
  color: var(--warm-silver); font-size: 9px;
}

/* ── FINAL RESULT ── */
.result-section { display: none; padding: 0 20px 40px; background: var(--parchment); }
.result-section.active { display: block; }

.result-card {
  background: var(--white);
  border: 1px solid var(--border-warm);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: rgba(0,0,0,0.05) 0px 4px 24px;
}
.result-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--parchment);
  border-bottom: 1px solid var(--border-cream);
}
.result-label {
  font-family: var(--serif);
  font-size: 13px; font-weight: 500; color: var(--charcoal);
}
.result-actions { display: flex; gap: 6px; }

.action-btn {
  padding: 6px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-warm);
  background: var(--ivory);
  color: var(--charcoal); font-size: 12px; font-family: var(--sans);
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: background 0.1s;
}
.action-btn:active { background: var(--warm-sand); }
.action-btn.success { color: var(--terracotta); border-color: var(--coral); }

.result-body { padding: 18px; }
#finalResult {
  font-family: var(--serif);
  font-size: 16px; font-weight: 400;
  line-height: 1.85; color: var(--near-black);
  word-break: break-word;
}

/* ── LANGUAGE MODAL ── */
.lang-modal {
  display: none; position: fixed; inset: 0;
  background: var(--parchment);
  z-index: 500; flex-direction: column;
  max-width: 480px; margin: 0 auto;
}
.lang-modal.active { display: flex; }

.lang-modal-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: var(--parchment);
  border-bottom: 1px solid var(--border-cream);
  flex-shrink: 0;
}
.back-btn {
  width: 34px; height: 34px; border-radius: var(--r-md);
  border: 1px solid var(--border-warm); background: var(--ivory);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--charcoal); flex-shrink: 0;
}
.back-btn:active { background: var(--warm-sand); }
.lang-modal-title {
  font-family: var(--serif);
  font-size: 17px; font-weight: 500; color: var(--near-black);
}

.lang-search-wrap {
  padding: 12px 20px;
  background: var(--ivory);
  border-bottom: 1px solid var(--border-cream); flex-shrink: 0;
}
.lang-search {
  width: 100%; padding: 10px 16px;
  border: 1px solid var(--border-warm); border-radius: var(--r-lg);
  background: var(--parchment); outline: none;
  font-family: var(--sans); font-size: 14px; color: var(--near-black);
}
.lang-search::placeholder { color: var(--warm-silver); }
.lang-search:focus { border-color: var(--ring-warm); }

.lang-list { overflow-y: auto; flex: 1; background: var(--ivory); }

.lang-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid var(--border-cream);
  cursor: pointer; background: var(--ivory);
  transition: background 0.08s;
}
.lang-item:active { background: var(--parchment); }
.lang-item-left { display: flex; align-items: center; gap: 14px; }
.lang-flag {
  width: 40px; height: 40px; border-radius: var(--r-lg);
  background: var(--parchment); border: 1px solid var(--border-cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.lang-item-name { font-size: 15px; font-weight: 500; color: var(--near-black); }
.lang-item-code { font-size: 11px; color: var(--stone); margin-top: 2px; letter-spacing: 0.3px; }
.lang-check {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--terracotta);
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
}
.lang-item.selected .lang-check { display: flex; }

/* ── SETTINGS DRAWER ── */
.drawer-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20,20,19,0.35); z-index: 200;
}
.drawer-overlay.active { display: block; }

.drawer {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 480px;
  background: var(--ivory);
  border-top: 1px solid var(--border-cream);
  border-radius: 20px 20px 0 0;
  z-index: 201;
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
  max-height: 86vh; overflow-y: auto;
}
.drawer.open { transform: translateX(-50%) translateY(0); }

.drawer-handle {
  width: 36px; height: 4px;
  background: var(--border-warm); border-radius: 2px;
  margin: 12px auto 0;
}
.drawer-title {
  font-family: var(--serif);
  font-size: 18px; font-weight: 500; color: var(--near-black);
  padding: 16px 20px 10px;
}

.setting-section { border-top: 1px solid var(--border-cream); padding: 16px 20px; }
.setting-section-label {
  font-size: 10px; color: var(--stone);
  letter-spacing: 0.6px; text-transform: uppercase;
  margin-bottom: 12px;
}

.setting-row { display: flex; align-items: center; justify-content: space-between; }
.setting-row + .setting-row { border-top: 1px solid var(--border-cream); margin-top: 12px; padding-top: 12px; }
.setting-name { font-size: 14px; font-weight: 500; color: var(--near-black); }
.setting-desc { font-size: 12px; color: var(--stone); margin-top: 2px; line-height: 1.5; }

.num-control { display: flex; align-items: center; gap: 12px; }
.num-btn {
  width: 30px; height: 30px; border-radius: var(--r-md);
  border: 1px solid var(--border-warm); background: var(--parchment);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px; color: var(--charcoal);
  line-height: 1; user-select: none;
}
.num-btn:active { background: var(--warm-sand); }
.num-val {
  font-family: var(--serif);
  font-size: 18px; font-weight: 500; color: var(--terracotta);
  min-width: 22px; text-align: center;
}

.key-field {
  width: 100%; border: 1px solid var(--border-warm); border-radius: var(--r-lg);
  background: var(--parchment);
  display: flex; align-items: center; overflow: hidden; margin-top: 10px;
}
#apiKeyInput {
  flex: 1; background: transparent; border: none; outline: none;
  padding: 11px 16px; font-family: var(--sans); font-size: 13px;
  color: var(--near-black); min-width: 0; letter-spacing: 0.5px;
}
#apiKeyInput::placeholder { color: var(--warm-silver); }
.key-eye {
  padding: 0 14px; color: var(--stone);
  cursor: pointer; display: flex; align-items: center; flex-shrink: 0;
}
.key-eye:active { color: var(--charcoal); }
.key-note { font-size: 11px; color: var(--stone); margin-top: 8px; line-height: 1.6; }

.model-tag {
  font-size: 11px; color: var(--charcoal);
  background: var(--warm-sand);
  padding: 4px 10px; border-radius: var(--r-2xl);
  letter-spacing: 0.3px;
}

.save-btn {
  margin: 16px 20px 36px; width: calc(100% - 40px);
  padding: 13px 24px;
  background: var(--terracotta); color: var(--ivory);
  border: none; border-radius: var(--r-lg);
  font-family: var(--sans); font-size: 15px; font-weight: 500; cursor: pointer;
  letter-spacing: 0.3px;
}
.save-btn:active { background: #b5573a; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--near-black); color: var(--warm-silver);
  font-size: 13px; padding: 10px 20px; border-radius: var(--r-2xl);
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 999; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; animation: spin 0.9s linear infinite; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 2px; }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">

// ─────────────────────────────────────────
// DeepSeek API
// ─────────────────────────────────────────
async function callDeepSeek(messages, onChunk, temperature = 0.5) {
  if (!state.apiKey) throw new Error('NO_KEY');
  const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` },
    body: JSON.stringify({ model: 'deepseek-chat', messages, stream: true, temperature, max_tokens: 2048 })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let result = '', buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try {
        const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
        if (delta) { result += delta; onChunk && onChunk(delta, result); }
      } catch {}
    }
  }
  return result;
}

// ─────────────────────────────────────────
// SYSTEM PROMPTS — 四阶引擎
// ─────────────────────────────────────────

// 阶一：三路初译
function promptPathA(src, tgt) {
  return `你是一位严谨的语言学家，专精${src}与${tgt}互译，你的核心使命是「忠实」。

翻译准则：
1. 逐句对应原文，不遗漏任何信息，不擅自增减内容
2. 保留原文的句式结构、标点逻辑与段落节奏
3. 专有名词、人名、地名采用标准译法
4. 语域（正式/口语/学术/文学）与原文严格一致
5. 对歧义词选择语境最贴切的解读，不做主观发挥

仅输出译文本身，不附任何说明或注释。`;
}
function promptPathB(src, tgt) {
  return `你是一位以${tgt}为母语的资深编辑，你的核心使命是「地道」。

翻译策略：
1. 深刻领会原文的深层意图与情感语气
2. 以地道${tgt}自然表达，不受原文句式束缚
3. 主动使用${tgt}中的惯用表达、成语、搭配，避免翻译腔
4. 在保持语义完整的前提下，大胆重构句子结构以提升可读性
5. 文化隐喻、俚语、幽默感尽量做到等效传递

仅输出译文本身，不附任何说明或注释。`;
}
function promptPathC(src, tgt) {
  return `你是一位跨领域专家翻译，擅长自动识别文本所属领域并调用该领域专业知识进行翻译。

工作流程：
1. 首先判断文本领域：商务/法律/医学/技术/文学/学术/日常/新闻等
2. 调用该领域的专业术语体系与表达惯例
3. 确保专业词汇的准确性，同时保持目标读者可读
4. 如涉及行业特有格式（合同条款/医嘱/代码注释等），保留其结构特征
5. 在专业性与流畅性之间取得最佳平衡

仅输出译文本身，不附任何说明或注释。`;
}

// 阶二：交叉批判
function promptCritique(src, tgt, selfPath, otherPathA, otherPathB) {
  return `你是一位翻译质量审核专家，现在需要你以批判视角评审两个竞争版本的翻译。

你当前代表的视角是：「${selfPath}」

请评审以下两个版本，找出它们各自的缺陷：
- 错译、漏译、增译了什么
- 哪里翻译腔过重
- 哪些专业术语处理不当
- 哪里语义有偏差或歧义

输出格式：版本X的问题：…… | 版本Y的问题：……
语言简洁，每个版本评语控制在50字以内。不输出其他任何内容。`;
}

// 阶三：综合裁决
function promptSynth(src, tgt) {
  return `你是首席翻译裁决官，拥有最终决定权。你将综合三路译文、三份批判报告，以及改进备忘录，裁决出最优${tgt}译文。

裁决标准（按优先级排序）：
1. 准确性 — 原文信息完整传达，零遗漏零增减
2. 地道性 — 以${tgt}母语者的语感自然表达
3. 流畅性 — 通篇连贯，过渡自然，节奏舒适
4. 专业性 — 术语准确，语域匹配
5. 风格还原 — 情感基调、正式程度与原文一致

工作方式：
- 综合三路的优点，修正已识别的缺陷
- 必要时完全重写某些句子，不必拘泥于任何单一版本
- 在正文之后，另起一行输出改进备忘录，格式为：【备忘录】本轮遗留问题：……

输出格式：
[最优译文正文]
【备忘录】本轮遗留问题：[简要说明下一轮需重点优化的方向，不超过60字]`;
}

// 阶四：质量终审
function promptAudit(src, tgt) {
  return `你是顶级翻译质量评审员，请对以下最终译文进行专业评分与点评。

评分维度（各满分10分）：
- 忠实度：原文信息传达是否完整准确
- 流畅度：目标语言读来是否自然流畅
- 地道度：是否使用了${tgt}母语者的地道表达

输出格式（严格遵守，不输出任何其他内容）：
SCORES:忠实度:[数字]/流畅度:[数字]/地道度:[数字]
REMARK:[50字以内的综合评语，指出最大亮点和最主要的遗憾]`;
}

// ─────────────────────────────────────────
// 解析综合输出（正文 + 备忘录）
// ─────────────────────────────────────────
function parseSynthOutput(raw) {
  const memoMatch = raw.match(/【备忘录】(.+)/s);
  const memo = memoMatch ? memoMatch[1].replace('本轮遗留问题：', '').trim() : '';
  const translation = raw.replace(/【备忘录】.*/s, '').trim();
  return { translation, memo };
}

function parseAuditOutput(raw) {
  const scoreMatch = raw.match(/SCORES:忠实度:(\d+)\/流畅度:(\d+)\/地道度:(\d+)/);
  const remarkMatch = raw.match(/REMARK:(.+)/s);
  return {
    scores: scoreMatch ? [parseInt(scoreMatch[1]), parseInt(scoreMatch[2]), parseInt(scoreMatch[3])] : [8, 8, 8],
    remark: remarkMatch ? remarkMatch[1].trim() : ''
  };
}

// ─────────────────────────────────────────
async function doTranslate() {
  const text = document.getElementById('sourceText').value.trim();
  if (!text) { showToast('请先输入要翻译的内容'); return; }
  if (!state.apiKey) { showToast('请先在设置中填写 API 密钥'); openDrawer(); return; }
  if (state.running) return;

  state.running = true;
  const btn = document.getElementById('translateBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner">◌</span>&nbsp;引擎运行中…`;

  // Reset UI
  document.getElementById('resultSection').classList.remove('active');
  document.getElementById('finalResult').textContent = '';
  document.getElementById('roundsContainer').innerHTML = '';
  document.getElementById('auditContainer').innerHTML = '';
  document.getElementById('enginePanel').classList.add('active');

  // Progress: rounds×(3paths + 3critiques + 1synth) + 1audit
  const stepsPerRound = 7;
  const totalSteps = state.rounds * stepsPerRound + 1;
  let completedSteps = 0;
  const setProgress = n => {
    document.getElementById('progressFill').style.width = Math.round(n / totalSteps * 100) + '%';
  };
  const setStatus = msg => { document.getElementById('phaseStatus').textContent = msg; };

  const src = state.srcLang.name, tgt = state.tgtLang.name;
  let lastSynthResult = '';
  let lastMemo = '';

  try {
    for (let r = 0; r < state.rounds; r++) {
      // Build round card
      const roundEl = document.createElement('div');
      roundEl.className = 'round-card';
      roundEl.innerHTML = `
        <div class="round-header">
          <div class="round-num">${r + 1}</div>
          <div class="round-title">第 ${r + 1} 轮迭代</div>
          <div class="round-badge" id="rbadge${r}">进行中</div>
        </div>
        <div class="paths-row">
          <div class="path-item">
            <div class="path-label">
              <span>A · 语言学家</span>
              <span class="path-lock">过程</span>
            </div>
            <div class="path-text streaming" id="pa${r}"></div>
          </div>
          <div class="path-item">
            <div class="path-label">
              <span>B · 本土编辑</span>
              <span class="path-lock">过程</span>
            </div>
            <div class="path-text streaming" id="pb${r}"></div>
          </div>
          <div class="path-item">
            <div class="path-label">
              <span>C · 领域专家</span>
              <span class="path-lock">过程</span>
            </div>
            <div class="path-text streaming" id="pc${r}"></div>
          </div>
        </div>
        <div class="critique-row">
          <div class="critique-item">
            <div class="critique-label">A 的批判</div>
            <div class="critique-text streaming" id="ca${r}"></div>
          </div>
          <div class="critique-item">
            <div class="critique-label">B 的批判</div>
            <div class="critique-text streaming" id="cb${r}"></div>
          </div>
          <div class="critique-item">
            <div class="critique-label">C 的批判</div>
            <div class="critique-text streaming" id="cc${r}"></div>
          </div>
        </div>
        <div class="synth-row">
          <div class="synth-label">
            <span class="synth-label-text">裁决综合 · Round ${r + 1}</span>
            <span class="synth-lock">过程</span>
          </div>
          <div class="synth-text streaming" id="synth${r}"></div>
        </div>
        <div class="memo-row" id="memo-row${r}" style="display:none">
          <div class="memo-label">改进备忘录</div>
          <div class="memo-text" id="memo${r}"></div>
        </div>`;
      document.getElementById('roundsContainer').appendChild(roundEl);
      roundEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      const paEl = document.getElementById(`pa${r}`);
      const pbEl = document.getElementById(`pb${r}`);
      const pcEl = document.getElementById(`pc${r}`);
      const caEl = document.getElementById(`ca${r}`);
      const cbEl = document.getElementById(`cb${r}`);
      const ccEl = document.getElementById(`cc${r}`);
      const synthEl = document.getElementById(`synth${r}`);

      // ── 阶一：三路并发初译 ──
      setStatus(`第 ${r + 1} 轮 · 阶一：三路并发初译…`);

      const buildUserMsg = (pathRole) => {
        if (r === 0) {
          return `请将以下${src}文本翻译成${tgt}：\n\n${text}`;
        }
        const memoNote = lastMemo ? `\n\n【改进备忘录 — 上一轮遗留问题，请重点关注】\n${lastMemo}` : '';
        return `请将以下${src}文本翻译成${tgt}，并在上一轮最优译文基础上，从你的「${pathRole}」视角进行针对性优化。${memoNote}\n\n【原文】\n${text}\n\n【上一轮最优译文（参考基准）】\n${lastSynthResult}`;
      };

      const [resA, resB, resC] = await Promise.all([
        callDeepSeek([
          { role: 'system', content: promptPathA(src, tgt) },
          { role: 'user', content: buildUserMsg('语言学家 — 忠实') }
        ], (_, full) => { paEl.textContent = full; }, 0.5),
        callDeepSeek([
          { role: 'system', content: promptPathB(src, tgt) },
          { role: 'user', content: buildUserMsg('本土编辑 — 地道') }
        ], (_, full) => { pbEl.textContent = full; }, 0.85),
        callDeepSeek([
          { role: 'system', content: promptPathC(src, tgt) },
          { role: 'user', content: buildUserMsg('领域专家 — 专业') }
        ], (_, full) => { pcEl.textContent = full; }, 0.6),
      ]);

      paEl.classList.remove('streaming');
      pbEl.classList.remove('streaming');
      pcEl.classList.remove('streaming');
      completedSteps += 3; setProgress(completedSteps);

      // ── 阶二：交叉批判（并发） ──
      setStatus(`第 ${r + 1} 轮 · 阶二：交叉批判…`);

      const critiqueUserA = `原文（${src}）：\n${text}\n\n你需要评审：\n版本X（本土编辑）：${resB}\n版本Y（领域专家）：${resC}`;
      const critiqueUserB = `原文（${src}）：\n${text}\n\n你需要评审：\n版本X（语言学家）：${resA}\n版本Y（领域专家）：${resC}`;
      const critiqueUserC = `原文（${src}）：\n${text}\n\n你需要评审：\n版本X（语言学家）：${resA}\n版本Y（本土编辑）：${resB}`;

      const [critA, critB, critC] = await Promise.all([
        callDeepSeek([
          { role: 'system', content: promptCritique(src, tgt, '语言学家', '本土编辑', '领域专家') },
          { role: 'user', content: critiqueUserA }
        ], (_, full) => { caEl.textContent = full; }, 0.4),
        callDeepSeek([
          { role: 'system', content: promptCritique(src, tgt, '本土编辑', '语言学家', '领域专家') },
          { role: 'user', content: critiqueUserB }
        ], (_, full) => { cbEl.textContent = full; }, 0.4),
        callDeepSeek([
          { role: 'system', content: promptCritique(src, tgt, '领域专家', '语言学家', '本土编辑') },
          { role: 'user', content: critiqueUserC }
        ], (_, full) => { ccEl.textContent = full; }, 0.4),
      ]);

      caEl.classList.remove('streaming');
      cbEl.classList.remove('streaming');
      ccEl.classList.remove('streaming');
      completedSteps += 3; setProgress(completedSteps);

      // ── 阶三：综合裁决 ──
      setStatus(`第 ${r + 1} 轮 · 阶三：综合裁决…`);

      const synthMsg = `原文（${src}）：\n${text}

版本A（语言学家）：\n${resA}
版本B（本土编辑）：\n${resB}
版本C（领域专家）：\n${resC}

批判报告：
A视角对B/C的批判：${critA}
B视角对A/C的批判：${critB}
C视角对A/B的批判：${critC}
${lastSynthResult ? `\n上一轮最优译文（参考基准）：\n${lastSynthResult}` : ''}
${lastMemo ? `\n上一轮改进备忘录：${lastMemo}` : ''}

请综合以上所有信息，裁决出本轮最优${tgt}译文，并输出改进备忘录。`;

      let rawSynth = '';
      await callDeepSeek([
        { role: 'system', content: promptSynth(src, tgt) },
        { role: 'user', content: synthMsg }
      ], (_, full) => {
        rawSynth = full;
        const { translation } = parseSynthOutput(full);
        synthEl.textContent = translation || full;
      }, 0.3);

      synthEl.classList.remove('streaming');

      const { translation: synthTranslation, memo } = parseSynthOutput(rawSynth);
      synthEl.textContent = synthTranslation;
      lastSynthResult = synthTranslation;
      lastMemo = memo;

      // Show memo
      if (memo) {
        document.getElementById(`memo-row${r}`).style.display = 'block';
        document.getElementById(`memo${r}`).textContent = memo;
      }

      completedSteps += 1; setProgress(completedSteps);
      const badge = document.getElementById(`rbadge${r}`);
      badge.textContent = '完成'; badge.classList.add('done');
    }

    // ── 阶四：质量终审 ──
    setStatus('阶四：质量终审…');

    const auditEl = document.createElement('div');
    auditEl.className = 'audit-card';
    auditEl.innerHTML = `
      <div class="audit-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c96442" stroke-width="1.5" stroke-linecap="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span class="audit-title">质量终审报告</span>
      </div>
      <div class="audit-body">
        <div class="score-row" id="scoreRow">
          <div class="score-item">
            <span class="score-num" id="s0">—</span>
            <span class="score-label">忠实度</span>
            <div class="score-bar-wrap"><div class="score-bar" id="sb0" style="width:0%"></div></div>
          </div>
          <div class="score-item">
            <span class="score-num" id="s1">—</span>
            <span class="score-label">流畅度</span>
            <div class="score-bar-wrap"><div class="score-bar" id="sb1" style="width:0%"></div></div>
          </div>
          <div class="score-item">
            <span class="score-num" id="s2">—</span>
            <span class="score-label">地道度</span>
            <div class="score-bar-wrap"><div class="score-bar" id="sb2" style="width:0%"></div></div>
          </div>
        </div>
        <div class="audit-remark streaming" id="auditRemark"></div>
      </div>`;
    document.getElementById('auditContainer').appendChild(auditEl);
    auditEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    const auditMsg = `原文（${src}）：\n${text}\n\n最终译文（${tgt}）：\n${lastSynthResult}`;
    let rawAudit = '';
    await callDeepSeek([
      { role: 'system', content: promptAudit(src, tgt) },
      { role: 'user', content: auditMsg }
    ], (_, full) => {
      rawAudit = full;
      const { remark } = parseAuditOutput(full);
      document.getElementById('auditRemark').textContent = remark || '';
    }, 0.3);

    const { scores, remark } = parseAuditOutput(rawAudit);
    document.getElementById('auditRemark').textContent = remark;
    document.getElementById('auditRemark').classList.remove('streaming');

    // Animate scores
    scores.forEach((s, i) => {
      document.getElementById(`s${i}`).textContent = s;
      setTimeout(() => {
        document.getElementById(`sb${i}`).style.width = (s * 10) + '%';
        document.getElementById(`sb${i}`).style.transition = 'width 0.6s ease';
      }, i * 150);
    });

    completedSteps += 1; setProgress(completedSteps);
    setStatus('翻译完成');

    // Show final
    document.getElementById('finalResult').textContent = lastSynthResult;
    document.getElementById('resultSection').classList.add('active');
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    if (err.message === 'NO_KEY') {
      showToast('请先填写 API 密钥'); openDrawer();
    } else {
      showToast('请求失败：' + err.message.slice(0, 38));
    }
    setStatus('引擎异常，请重试');
  } finally {
    state.running = false;
    btn.disabled = false;
    btn.innerHTML = '启动四阶翻译引擎';
  }
}

document.getElementById('translateBtn').addEventListener('click', doTranslate);
init();
</script>
</body>
</html>
